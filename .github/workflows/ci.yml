name: FEYA validation

on:
  pull_request:
  push:
    branches:
      - main
      - owner-ui-v1

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --silent

      - name: Search policy simulations
        run: npm run test:search

      - name: Search migration constraints
        run: npm run test:search-db

      - name: Typecheck
        run: npm run typecheck

      - name: Admin boundary check
        run: npm run check:admin-boundary

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -n 120
