name: One-shot Next 16.3.7 lock upgrade

on:
  push:
    branches:
      - work/storefront-next16-upgrade-20260930
    paths:
      - .github/workflows/next16-upgrade-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/storefront-next16-upgrade-20260930
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile on Next 16.3.7
        run: |
          npm pkg set dependencies.next=16.3.7
          npm pkg set devDependencies.eslint-config-next=16.3.7
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated dependency state and remove one-shot workflow
        run: |
          rm .github/workflows/next16-upgrade-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/next16-upgrade-once.yml
          git commit -m "Upgrade Next.js dependency baseline to 16.3.7"
          git push origin HEAD:work/storefront-next16-upgrade-20260930

      - name: Install upgraded dependency tree
        run: npm ci --no-audit --no-fund

      - name: Search policy simulations
        run: npm run test:search

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
